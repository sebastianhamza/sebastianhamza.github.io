baseURL = "https://sebastianhamza.github.io/"
locale = "en-us"
title = "Sebastian Hamza"
theme = "cactus"
enableEmoji = true

[pagination]
  pagerSize = 8        # posts per archive page

# Navigation menu (header + footer). Add/remove/reorder freely.
[menus]
  [[menus.main]]
    name = "home"
    url = "/"
    weight = 1
  [[menus.main]]
    name = "about"
    url = "/about/"
    weight = 2
  [[menus.main]]
    name = "articles"
    url = "/posts/"
    weight = 3
  [[menus.main]]
    name = "projects"
    url = "https://github.com/sebastianhamza"
    weight = 4
  [[menus.main]]
    name = "search"
    url = "/search/"
    weight = 5

[taxonomies]
  tag = "tags"
  category = "categories"

[markup]
  [markup.highlight]
    style = "monokai"          # any Chroma style (hugo gen chromastyles)
    lineNos = false
    noClasses = false
  [markup.goldmark.renderer]
    unsafe = true              # allow raw HTML in Markdown

# The JSON output on the home page is the client-side search index (/index.json).
[outputs]
  home = ["HTML", "RSS", "JSON"]

# ───────────────────────────────────────────────────────────────────────
# Theme options — see themes/cactus/README.md for the full reference.
# ───────────────────────────────────────────────────────────────────────
[params]
  author = "Sebastian Hamza"
  description = "Hi, I'm Sebastian Hamza. Welcome to my personal blog — notes on things I build and learn."
  dateFormat = "2 Jan 2006"        # Go time layout, e.g. "14 Nov 2016"
  direction = "ltr"                # "rtl" loads the Vazir font
  projectsUrl = "https://github.com/sebastianhamza"

  # Look & feel
  colorscheme = "custom"           # dark | light | classic | white | custom
  pageWidth = 48                   # rem

  rss = true

  # Logo / avatar in the header (replace the images in static/images/)
  [params.logo]
    enabled = true
    width = 50
    height = 50
    url = "/images/logo.png"
    gravatar = false               # use your Gravatar instead of url
    grayout = true

  [params.favicon]
    [params.favicon.desktop]
      url = "/images/favicon.ico"
    [params.favicon.android]
      url = "/images/favicon-192x192.png"
    [params.favicon.apple]
      url = "/images/apple-touch-icon.png"

  # Used by logo/favicon when their `gravatar = true`
  [params.gravatar]
    email = "name@email.com"
    hash = ""

  # Home page overview
  [params.tagsOverview]
    enabled = false                # show a tag cloud on the home page
  [params.postsOverview]
    showAllPosts = false           # true = paginate all posts; false = recent N
    postCount = 5                  # N most-recent posts when showAllPosts = false
    sortUpdated = false            # sort by last-modified instead of date
  [params.archive]
    sortUpdated = false
  [params.post]
    showUpdated = false            # show "Updated:" date on posts

  # Footer copyright years (blank endYear = current year)
  [params.copyright]
    startYear = 2026
    # endYear = 2027

  # 404 page
  [params.error404]
    enabled = true
    title = "404 Page Not Found"
    description = "The page you are looking for might have been removed, had its name changed, or is temporarily unavailable."

  # Open Graph / social metadata
  [params.openGraph]
    fbAppId = ""
    fbAdmins = ""
    twitterId = ""

  # Math typesetting
  [params.mathjax]
    enabled = false

  # Comments — Disqus (disabled; put your shortname below to enable)
  [params.disqus]
    enabled = false
    shortname = ""

  # Comments — utterances (needs a public GitHub repo + GitHub App installed)
  [params.utterances]
    enabled = false
    repo = "sebastianhamza/sebastianhamza.github.io"
    issueTerm = "pathname"          # pathname | url | title | ...
    label = "Comment"
    theme = "github-dark"

  # Analytics (all disabled by default)
  [params.googleAnalytics]
    enabled = false
    id = ""
  [params.baiduAnalytics]
    enabled = false
    id = ""
  [params.cloudflareAnalytics]
    enabled = false
    id = ""
  [params.umamiAnalytics]
    enabled = false
    id = ""
    host = ""
    scriptName = "umami.js"

  # Load assets from a CDN instead of bundling them locally
  [params.cdn]
    enable = true
    fontAwesome = "https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"

  # Social links — repeat the block per account.
  # `icon` is a Font Awesome brand name (or "mail" / "rss"); `label` is optional.
  [[params.socialLinks]]
    icon = "github"
    link = "https://github.com/sebastianhamza"
  [[params.socialLinks]]
    icon = "rss"
    link = "/index.xml"
  # [[params.socialLinks]]
  #   icon = "mail"
  #   link = "mailto:name@email.com"
  # [[params.socialLinks]]
  #   icon = "mastodon"
  #   label = "mastodon.social"
  #   link = "https://mastodon.social/@you"
