# Builds the Hugo site and publishes it to GitHub Pages.
#
# One-time setup: repo Settings → Pages → Build and deployment →
# Source = "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Must be >= theme.toml min_version (0.158.0). The theme needs
      # Hugo extended + Dart Sass (the SCSS uses @use and css.Sass vars).
      HUGO_VERSION: 0.167.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Hugo (extended)
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      # Standalone Dart Sass (the npm "sass" package lacks the embedded
      # protocol Hugo needs).
      - name: Install Dart Sass
        env:
          SASS_VERSION: 1.105.1
        run: |
          curl -sL -o dart-sass.tar.gz "https://github.com/sass/dart-sass/releases/download/${SASS_VERSION}/dart-sass-${SASS_VERSION}-linux-x64.tar.gz"
          tar -xzf dart-sass.tar.gz
          echo "$PWD/dart-sass" >> "$GITHUB_PATH"

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build
        env:
          HUGO_ENVIRONMENT: production
        run: hugo --minify --gc

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
